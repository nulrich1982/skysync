# =============================================================================
# SkySync configuration — copy to config.toml and edit.
#
# Default deployment: TWO-WAY sync, Microsoft To Do <-> Skylight Calendar,
# on a PERSONAL Microsoft account. The local sync ledger is the system of
# record. (An optional SharePoint master for work/school tenants is supported
# — see the commented [sharepoint] section at the bottom.)
#
# NON-SECRET VALUES ONLY. Secrets (Skylight token/password) are seeded into
# the DPAPI store:
#       python -m skysync.secrets set skylight_token
# config.toml is .gitignored; this example file is committed.
# =============================================================================

[general]
state_dir = "state"        # ledger db + heartbeat live here (gitignored)
log_dir = "logs"
log_level = "INFO"

[heartbeat]
file = "state/heartbeat.json"
ping_url = ""              # optional: healthchecks.io-style URL pinged on success
max_age_minutes = 45       # check-heartbeat.ps1 alerts past this age

[schedule]
# CONFIG DECISION #2 (cadence). Default: every 15 minutes.
# Consumed by register-task.ps1 when (re)registering the scheduled task.
interval_minutes = 15

[graph]
# Personal Microsoft account (outlook.com etc.): keep "consumers".
# Work/school tenant: use the tenant GUID instead.
tenant_id = "consumers"
client_id = "YOUR-APP-CLIENT-GUID"   # from the Entra app registration (SETUP.md step 1)

[todo]
# To Do list that receives tasks whose assignee has no per-child mapping.
default_list = "Tasks"

[grocery]
# Optional second pairing: mirror a Skylight LIST (e.g. the grocery list) to
# a Microsoft To Do list. Items are dateless; checking off syncs as
# completion; with mirror_deletes, clearing an item on either side clears it
# on the other. Runs with its own ledger (state/ledger-grocery.sqlite3).
enabled = false
skylight_list = "Grocery List"   # label of the list on the frame
todo_list = "Grocery List"       # display name of the To Do list
mirror_deletes = true

[skylight]
frame_id = "1234567"       # from DevTools/HAR capture — see SETUP.md
chore_window_days_past = 14
chore_window_days_future = 60
# Recurring/routine chores are Skylight-native (rendered as instances of an
# RRULE); they are NOT synced by default and are left alone on the frame.
sync_recurring = false

# Extra headers merged into every Skylight request (browser-like set). Optional.
# [skylight.headers]
# "skylight-api-version" = "2026-05-01"

# --- Skylight auth ---
# Recommended: hands-off OAuth. Seed skylight_email + skylight_password (DPAPI),
# run the one-time login `python -m skysync.skylight.oauth login`, and the
# client auto-refreshes a rotating token forever. Alternatively seed a manually
# captured `skylight_token` (expires ~weekly). OAuth wins if both are present.

[sync]
# CONFIG DECISION #3 (conflict policy). Default: most-recently-modified wins;
# the discarded side's content is logged at WARNING. Note: Skylight exposes
# no timestamps, so in a simultaneous-edit conflict To Do wins.
conflict_policy = "most_recent_wins"

# CONFIG DECISION #4 (deletes vs completions). Defaults:
#   completions propagate in every direction;
#   a DELETE in To Do removes the Skylight chore;
#   a DELETE on the Skylight frame does NOT delete the To Do task — the
#   chore just detaches (logged), so a kid clearing the frame can't destroy
#   the family backlog.
completions = "both_ways"
deletes_todo_to_skylight = true
deletes_skylight_to_todo = false
deletes_sharepoint_propagate = true   # only relevant with a [sharepoint] master

# CONFIG DECISION #5 (chore stream). Default per-child: each child has their
# own To Do list and their own Skylight category (family member).
stream_mode = "per_child"

# =============================================================================
# CONFIG DECISION #1: list -> child mapping (worked example — replace).
#
# For each child:
#   todo_list         display name of their Microsoft To Do list
#   skylight_category label of their Skylight category/family member
#                     (Frame settings -> family members; matched
#                     case-insensitively, resolved to an id at runtime)
#
# A task whose assignee can't be mapped still syncs within To Do (it lands in
# [todo].default_list) but is skipped for Skylight, with a log line.
# =============================================================================

[mapping.children.avery]
todo_list = "Avery's Chores"
skylight_category = "Avery"

[mapping.children.blake]
todo_list = "Blake's Chores"
skylight_category = "Blake"

# =============================================================================
# OPTIONAL three-way mode: a SharePoint list as the system of record
# (work/school tenants only — personal accounts have no SharePoint).
# Uncomment, set [graph].tenant_id to your tenant GUID, add delegated scope
# Sites.ReadWrite.All to the app registration, and add an sp_assignee to each
# child mapping. See SETUP.md appendix.
#
# [sharepoint]
# site_id = "contoso.sharepoint.com,1111...,2222..."
# list_id = "3333..."
#
# (per child:)  sp_assignee = "Avery"
# =============================================================================
